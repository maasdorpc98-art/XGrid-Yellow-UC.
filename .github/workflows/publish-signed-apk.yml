name: Publish signed XGrid Yellow UC v29.4.2 APK
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/publish-signed-apk.yml
  workflow_dispatch:
permissions:
  contents: write
  actions: read
jobs:
  publish:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Ensure Android verification tools
        run: '"$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "build-tools;35.0.0"'
      - name: Download already signed successful build #8
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          source_run=40088027778
          details="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$source_run" --jq '[.status,.conclusion,.head_branch,.head_repository.full_name] | join("|")')"
          if [[ "$details" != "completed|success|main|$GITHUB_REPOSITORY" ]]; then
            echo "::error::Source signing workflow must have succeeded on this repository main."
            exit 1
          fi
          mkdir -p dist
          gh run download "$source_run" --repo "$GITHUB_REPOSITORY" --name XGrid-Yellow-UC-SIGNED-NewPermanentKey --dir dist
          find dist -maxdepth 2 -name '*.apk' -type f -print
          count="$(find dist -name '*.apk' -type f | wc -l)"
          test "$count" -eq 1
      - name: Validate and publish direct APK
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          tools="$ANDROID_HOME/build-tools/35.0.0"
          source_apk="$(find dist -name '*.apk' -type f -print -quit)"
          test -n "$source_apk"
          apk="dist/XGrid_Yellow_UC_v29.4.2_Signed.apk"
          if [[ "$source_apk" != "$apk" ]]; then mv "$source_apk" "$apk"; fi
          "$tools/apksigner" verify --min-sdk-version 26 --verbose --print-certs "$apk"
          "$tools/zipalign" -c -P 16 4 "$apk"
          metadata="$("$tools/aapt" dump badging "$apk" | grep '^package:')"
          [[ "$metadata" == *"name='org.xgrid.orange'"* ]] || { echo "::error::Package mismatch"; exit 1; }
          [[ "$metadata" == *"versionCode='290402'"* ]] || { echo "::error::Version mismatch"; exit 1; }
          python3 - "$apk" <<'PY'
          import sys,zipfile
          with zipfile.ZipFile(sys.argv[1]) as z:
              assert z.testzip() is None, "Bad APK ZIP CRC"
              assert z.read("assets/pose_landmarker_full.task")[:8], "MediaPipe pose model missing"
              for lib in ("libmediapipe_tasks_vision_jni.so","libopencv_java4.so","libc++_shared.so"):
                  assert z.read("lib/arm64-v8a/"+lib)[:5] == bytes.fromhex("7f454c4602"), lib
          print("PASS: signed UC APK, pose model and ARM64 native engines")
          PY
          sha256sum "$apk" | tee dist/APK-SHA256.txt
          cat > dist/release-notes.md <<'NOTES'
          Directly installable ARM64 Android APK for XGrid Yellow UC v29.4.2.
          Package org.xgrid.orange, version code 290402.
          Bundles mandatory MediaPipe Pose Landmarker and OpenCV native motion analysis.
          Android APK signing verified by apksigner and ZIP alignment validated.
          
          NOTE: Signed with the new permanent key. Android cannot install it as an update
          over existing installations signed with the old Orange certificate.
          Back up app data before uninstalling the old signed application.
          Future APKs signed with this same permanent key can update this release.
          Runtime operation on a physical phone has not yet been established.
          NOTES
          if gh release view v29.4.2 --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload v29.4.2 "$apk" --repo "$GITHUB_REPOSITORY" --clobber
          else
            gh release create v29.4.2 "$apk" --repo "$GITHUB_REPOSITORY" \
              --target "$GITHUB_SHA" --title "XGrid Yellow UC v29.4.2 (signed APK)" \
              --notes-file dist/release-notes.md
          fi
          echo "Direct APK: https://github.com/$GITHUB_REPOSITORY/releases/download/v29.4.2/XGrid_Yellow_UC_v29.4.2_Signed.apk" >> "$GITHUB_STEP_SUMMARY"
