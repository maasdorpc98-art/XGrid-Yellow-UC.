name: Yellow UC build
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: yellow-uc-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Verify pinned pose model
        run: python3 scripts/ensure_model.py
      - name: Check Yellow controller syntax
        run: node --check assets/yellow.js
      - name: Compile native UC bridge and visual engine
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon :native:assembleRelease
      - name: Preserve engine packaging inputs
        uses: actions/upload-artifact@v4
        with:
          name: uc-engine-build-inputs
          path: |
            native/build/outputs/apk/release/native-release-unsigned.apk
            native/build/outputs/mapping/release/mapping.txt
          if-no-files-found: error
          retention-days: 7
